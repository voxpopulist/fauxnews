    #   run: |
    #     mkdir -p "$HOME/.cache/whisper" "$HOME/.cache/torch"

    # - name: Cache Whisper model files
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       ~/.cache/whisper
    #       ~/.cache/torch
    #     key: ${{ runner.os }}-whisper-models-v1
        
    # - name: Cache apt packages
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       /var/cache/apt/archives
    #       /var/lib/apt/lists
    #     key: ${{ runner.os }}-apt-${{ hashFiles('scripts/apt-packages.txt') }}
    #     restore-keys: |
    #       ${{ runner.os }}-apt-

    - name: Install apt dependencies (ffmpeg)
      run: |
        sudo apt-get update
        sudo xargs -a scripts/apt-packages.txt apt-get install -y

    - name: Run transcription script (OpenAI API)
      env:
        VERBOSE: "0"
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        chmod +x ./scripts/transcribe_flac.sh
        ./scripts/transcribe_flac.sh input

    - name: Organize files
      run: |
        chmod +x ./scripts/organize_files.sh
        ./scripts/organize_files.sh input

    - name: Convert FLAC to MP3 for web playback
      env:
        FFMPEG_LOGLEVEL: "error"
      run: |
        chmod +x ./scripts/convert_to_mp3.sh
        ./scripts/convert_to_mp3.sh
    - name: Setup Node.js for site build
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'docs/package-lock.json'

    - name: Install site dependencies
      run: |
        cd docs
        npm ci

    - name: Build static site
      run: |
        cd docs
        npm run build

    - name: Verify MP3s in build
      run: |
        MP3_COUNT=$(find docs/_site/samples -type f -name "*.mp3" | wc -l || true)
        echo "MP3 files in build: $MP3_COUNT"
        if [ "$MP3_COUNT" = "0" ]; then
          echo "No MP3s found in built site. Check passthrough copy and conversion." >&2
          exit 1
        fi

    - name: Add text files to git and commit changes (excluding MP3s)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Add only text files, not MP3s
        find samples -name "*.txt" -o -name "*.vtt" -o -name "*.srt" -o -name "*.json" -o -name "*.tsv" | xargs -r git add
        # Also add any new FLAC files that were moved
        find samples -name "*.flac" | xargs -r git add
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update transcripts and metadata"
          git push
        fi

    - name: Upload site artifact (for separate deploy workflow)
      uses: actions/upload-artifact@v4
      with:
        name: site-build
        path: ./docs/_site