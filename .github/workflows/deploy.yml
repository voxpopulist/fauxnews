name: Generate and Deploy Transcripts

on:
  push:
    branches: [ main ]
    paths: 
      - 'input/**/*.aiff'
      - 'input/**/*.flac'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write  # Changed from read to write to allow pushing
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-transcripts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.ACTIONS_TOKEN }}
        fetch-depth: 0  # Fetch full history for proper git operations
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Write Python requirements
      run: |
        echo "openai-whisper" > requirements.txt

    - name: Cache pip download cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Python virtualenv
      id: venv-cache
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}-py311

    - name: Create venv and install deps (on cache miss)
      if: steps.venv-cache.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Add venv to PATH
      run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

    - name: Ensure Whisper cache directories exist
      run: |
        mkdir -p "$HOME/.cache/whisper" "$HOME/.cache/torch"

    - name: Cache Whisper model files
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/whisper
          ~/.cache/torch
        key: ${{ runner.os }}-whisper-models-v1
        
    - name: Install ffmpeg (for MP3 conversion)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Run transcription script
      run: |
        chmod +x ./scripts/transcribe_flac.sh
        ./scripts/transcribe_flac.sh

    - name: Organize files
      run: |
        chmod +x ./scripts/organize_files.sh
        ./scripts/organize_files.sh input

    - name: Convert FLAC to MP3 for web playback
      run: |
        chmod +x ./scripts/convert_to_mp3.sh
        ./scripts/convert_to_mp3.sh

    - name: Setup Node.js for site build
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'docs/package-lock.json'

    - name: Install site dependencies
      run: |
        cd docs
        npm install

    - name: Build static site
      run: |
        cd docs
        npm run build

    - name: Add text files to git and commit changes (excluding MP3s)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Add only text files, not MP3s
        find samples -name "*.txt" -o -name "*.vtt" -o -name "*.srt" -o -name "*.json" -o -name "*.tsv" | xargs git add
        # Also add any new FLAC files that were moved
        find samples -name "*.flac" | xargs git add
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Add transcribed text files from workflow run"
          git push
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/_site
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-transcripts
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4