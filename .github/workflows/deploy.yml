name: Generate and Deploy Transcripts

on:
  push:
    branches: [ main ]
    paths: 
      - '**/*.aiff'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-transcripts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout with submodules (SSH)
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Verify audio layout
      run: bash scripts/verify_audio_layout.sh
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Write Python requirements
      run: |
        echo "openai-whisper" > requirements.txt

    - name: Cache pip download cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Python virtualenv
      id: venv-cache
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}-py311

    - name: Create venv and install deps (on cache miss)
      if: steps.venv-cache.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Add venv to PATH
      run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

    - name: Ensure Whisper cache directories exist
      run: |
        mkdir -p "$HOME/.cache/whisper" "$HOME/.cache/torch"

    - name: Cache Whisper model files
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/whisper
          ~/.cache/torch
        key: ${{ runner.os }}-whisper-models-v1
        
    - name: Download transcriber binary (pinned tag)
      if: ${{ vars.TRANSCRIBE_TAG != '' }}
      uses: robinraju/release-downloader@v1.11
      with:
        repository: voxpopulist/clipservatives-transcriber
        tag: ${{ vars.TRANSCRIBE_TAG }}
        fileName: transcribe-linux-amd64
        out-file-path: bin
        token: ${{ secrets.TRANSCRIBER_RELEASE_TOKEN }}

    - name: Download transcriber binary (latest)
      if: ${{ vars.TRANSCRIBE_TAG == '' }}
      uses: robinraju/release-downloader@v1.11
      with:
        repository: voxpopulist/clipservatives-transcriber
        latest: true
        fileName: transcribe-linux-amd64
        out-file-path: bin
        token: ${{ secrets.TRANSCRIBER_RELEASE_TOKEN }}

    - name: Verify downloaded binary
      run: |
        ls -la bin || true
        test -f bin/transcribe-linux-amd64

    - name: Install ffmpeg (for MP3 conversion)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Verify database presence
      run: |
        if [ -f transcriber/transcripts.db ]; then
          echo "✅ Found database at transcriber/transcripts.db"
        else
          echo "⚠️ Database not found at transcriber/transcripts.db (will process fresh)"
        fi

    - name: Convert AIFF to MP3 (mirrored into docs/)
      run: |
        chmod +x bin/transcribe-linux-amd64
        bin/transcribe-linux-amd64 \
          --convert_mp3 \
          --directory samples

    - name: Dry run (preview NEW vs SKIP)
      run: |
        chmod +x bin/transcribe-linux-amd64
        bin/transcribe-linux-amd64 \
          --directory samples \
          --model turbo \
          --database transcriber/transcripts.db \
          --dry-run

    - name: Generate transcripts
      run: |
        bin/transcribe-linux-amd64 \
          --directory samples \
          --model turbo \
          --database transcriber/transcripts.db \
          --output docs/index.html \
          --github-pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-transcripts
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4