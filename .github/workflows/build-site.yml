name: Build and Deploy Site

on:
  push:
    branches: [ main ]
    paths: 
      - 'docs/**'
      - 'samples/**'
      - '.github/workflows/build-site.yml'
  workflow_run:
    workflows: ["Process Audio and Build Site"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-site-only"
  cancel-in-progress: false

jobs:
  e2e-tests:
    name: Run E2E tests (smoke + critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install browsers
        uses: browser-actions/setup-chrome@v1
      
      - name: Update Chrome to latest
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install site dependencies (docs)
        if: ${{ github.event_name == 'push' }}
        run: |
          cd docs
          npm ci

      - name: Start Eleventy dev server (push)
        if: ${{ github.event_name == 'push' }}
        run: |
          cd docs
          npx @11ty/eleventy --serve --port=4321 &
          # wait for server
          for i in {1..30}; do curl -fsS http://localhost:4321 >/dev/null && break || sleep 1; done

      - name: Download site artifact from audio workflow
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: deploy.yml
          name: site-build
          path: site_artifact
          run_id: ${{ github.event.workflow_run.id }}

      - name: Serve built site artifact (workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          npx http-server site_artifact -p 4321 &
          for i in {1..30}; do curl -fsS http://localhost:4321 >/dev/null && break || sleep 1; done

      - name: Install test dependencies
        run: |
          cd tests
          npm ci

      - name: Run smoke tests (headless)
        env:
          HEADLESS: 'true'
          TEST_URL: 'http://localhost:4321'
        run: |
          cd tests
          npm run test:smoke

      # Only run full critical locally on push to docs; skip for workflow_run to keep it fast
      - name: Run critical tests (Chrome)
        if: ${{ github.event_name == 'push' }}
        env:
          HEADLESS: 'true'
          TEST_URL: 'http://localhost:4321'
          BROWSER: 'chrome'
        run: |
          cd tests
          npm run test:critical

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Attempt to download site artifact (if available)
      id: download_artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: deploy.yml
        name: site-build
        path: site_artifact
        if_no_artifact_found: ignore

    - name: Check for downloaded artifact
      id: check_artifact
      run: |
        if [ -d site_artifact ] && [ "$(ls -A site_artifact)" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build site (fallback if artifact not present)
      if: steps.check_artifact.outputs.exists == 'false'
      run: |
        echo "No prebuilt artifact found; building site now"
        cd docs
        npm ci
        npm run build
        # package built site for pages upload
        mkdir -p site_artifact
        cp -a docs/_site/. site_artifact/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact to Pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: site_artifact
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4